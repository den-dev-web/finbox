<meta charset="UTF-8" />
<!--
  Apply saved settings before first paint: no light-to-dark flash and no layout
  shift from table density. Key and values match src/js/state/settings.js.
-->
<script>
  (() => {
    let settings = {};
    try {
      settings = JSON.parse(localStorage.getItem("finbox-settings")) || {};
    } catch {
      // Storage can be blocked (private mode) or hold invalid JSON
    }
    let theme = settings.theme;
    if (theme !== "light" && theme !== "dark") {
      theme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }
    document.documentElement.dataset.theme = theme;
    if (settings.density === "compact") {
      document.documentElement.dataset.density = "compact";
    }
  })();
</script>
<!--
  Cross-document view transitions. Inline on purpose: Chrome checks the new
  page's opt-in before an external stylesheet may have arrived and aborts with
  "ViewTransition opt-in disabled".
-->
<style>
  @media (prefers-reduced-motion: no-preference) {
    @view-transition {
      navigation: auto;
    }
  }
</style>
